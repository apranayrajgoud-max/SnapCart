<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapCart - Product Listing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <h1 class="logo">SnapCart</h1>
    <div class="header-actions">
      <button id="cart-toggle" class="cart-toggle-btn">
        🛒 Cart (<span id="cart-count">0</span>)
      </button>
      <button id="logout-btn" class="logout-btn">Logout</button>
    </div>
  </header>

  <div class="search-filter-bar">
    <input type="text" id="search-input" placeholder="Search products...">
    <select id="category-filter">
      <option value="all">All Categories</option>
    </select>
  </div>

  <main class="main-layout">
    <section id="product-grid" class="product-grid">
      <!-- Product cards inserted here by JavaScript -->
    </section>

    <aside id="cart-sidebar" class="cart-sidebar">
      <div class="cart-header">
        <h2>Your Cart</h2>
        <button id="close-cart" class="close-cart-btn">&times;</button>
      </div>
      <div id="cart-items" class="cart-items">
        <!-- Cart items inserted here by JavaScript -->
      </div>
      <div class="cart-footer">
        <p class="cart-total">Total: ₹<span id="cart-total">0</span></p>
        <button id="checkout-btn" class="checkout-btn">Proceed to Checkout</button>
      </div>
    </aside>

    <div id="cart-overlay" class="cart-overlay"></div>
  </main>

  <script type="module" src="js/products.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
